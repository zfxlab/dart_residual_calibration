line-length = 100
target-version = "py312"
extend-exclude = [".git", ".venv", "__pycache__"]

[lint]
# 中文界面、报告和注释允许使用中文标点。
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[lint.isort]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 100
